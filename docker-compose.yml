services:
  interview-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-simulator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - QUESTIONS_PER_STAGE=2
      - DEBUG=false
    volumes:
      # 挂载整个应用目录，支持在宿主机直接修改或 git pull 代码与题库，重启即可生效而无需重新构建
      - ./app:/app/app

