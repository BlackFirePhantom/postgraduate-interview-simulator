services:
  interview-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-simulator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - QUESTIONS_PER_STAGE=2
      - DEBUG=false
    volumes:
      # 挂载题库目录，支持在宿主机直接修改或扩充 question_bank.json，无需重新构建镜像
      - ./app/data:/app/app/data
